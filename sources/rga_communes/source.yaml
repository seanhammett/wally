notes: |
  Clay shrink–swell per commune, measured where people live rather than over
  the commune's land. The BRGM exposure map (arrêté of 9 January 2026) is read
  polygon by polygon from the PMTiles archive Géorisques publishes, and every
  populated INSEE 200 m cell takes the class of the zone its centre falls in:
  none, low, medium or high. A commune's values are then shares of its
  residents, and a population-weighted mean class from 0 to 3.

  **Why residents and not area.** Shrink–swell damages buildings, so the land
  that matters is the land people have built on. A commune can be half high-
  exposure clay in its fields and have its village on limestone. Communes with
  no populated cell use the class at their representative point.

  **Checks.** Read at zoom 12, the archive's zones total 395,700 km², of which
  moderate or high 301,800 km² — 55.5% of metropolitan France, the figure
  published with the 2026 map. The 2020 map, which SDES crossed with individual
  houses, totals 390,600 km², so coverage is complete; the difference is the
  2026 revision, which moved land from low to high. Nationally 64% of residents
  live on moderate or high exposure.

  **Limits.** The map is drawn from 1:50,000 geology: it circumscribes zones
  prone to the phenomenon, not the soil under a given plot. A 200 m cell is
  assigned by its centre, which blurs zone edges by up to 140 m. Exposure is
  not a climate projection, but drier summers are what turn it into damage,
  which is why it sits next to the dry-soil and low-flow layers.
