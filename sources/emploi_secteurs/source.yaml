notes: |
  What kind of work — two views that answer different questions.

  **Residents' jobs** (census 2023) is what the people who live here do,
  wherever they do it. A commuter village outside Lyon can have a third of its
  residents in business services without a single office in the village. This
  is the view for "who would my neighbours be". It is the census's
  complementary exploitation: in communes under 10,000 inhabitants only one
  questionnaire in four is coded to a sector, and INSEE's counts are weighted
  estimates with decimals. Shares are blank below 60 residents in work, and the
  distinctive-sector map below 200.

  **Local jobs** (FLORES 2024) is the salaried jobs physically located in the
  commune on 31 December, whoever holds them. It is an administrative count,
  not a sample, so a village's number is exact — but it has no self-employed
  in it at all, which hides most farmers, artisans and freelancers; and it
  dates jobs to the employer's establishment, so a firm registered here with
  staff on sites elsewhere lifts this commune. December also means ski resorts
  are counted in season and seaside resorts out of it.

  **Culture, media & leisure is broader than "creative".** The census's 38
  sectors cannot separate the arts from sport and recreation, or advertising and
  design from veterinary work. So a ski resort scores high on it for its ski
  instructors and lift operators. The local-jobs fields do carry the finer
  divisions if you need them.

  **The distinctive sector** is the group whose share among residents is
  furthest above its national share (the location quotient). Everywhere has
  shops and schools; this map shows what a commune has more of than France
  does. Where no group reaches 1.5× its national share it is "Mixed".
