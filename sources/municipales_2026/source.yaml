notes: |
  The most recent municipal elections: 15 and 22 March 2026.

  Turnout is the only headline that exists everywhere. Political nuance is only
  attributed to lists in communes above the population threshold — about 3,200 of
  34,700 — so the nuance layer is deliberately shipped with most of the map blank
  rather than with a guess filled in. That gap is the reason the layer carries the
  count in its legend.

  The far more universal political fact in this file is that 23,677 communes had
  exactly one list on the ballot, which is why "lists standing" is a layer of its
  own.

  Round one covers every commune; round two only the 1,445 metropolitan communes that needed it. Turnout
  is reported from round one so that every commune is measured on the same day.
