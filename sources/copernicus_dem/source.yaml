notes: |
  Terrain height at 3 arc-seconds (~90 m), 1° tiles as cloud-optimised GeoTIFF.
  It is a surface model, so forest canopy and buildings add a few metres to
  a 90 m cell; for correcting temperature by altitude that is a few hundredths
  of a degree and does not matter.

  Used by `meteo_climat`. Météo-France's SAFRAN grid gives each 8 km cell the
  climate of the cell's mean altitude, which in the Alps is far above the
  valley towns where people live. Knowing both heights is what lets the
  transform move the value down to the valley.
