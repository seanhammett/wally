id: explore2_etiage
name: "Étiages estivaux à l'horizon TRACC : débit et durée (Explore2)"
attribution: "Explore2 (INRAE / OiEau / Météo-France / BRGM), agrégation communale par le réseau RARE — Licence Ouverte 2.0"
url: "https://www.data.gouv.fr/datasets/indicateurs-de-debits-futurs-explore2-tracc-agreges-par-territoire"
fetched: 2026-09-11
source_crs: "EPSG:4326"
kind: commune_table
fetch: auto
order: 22
min_join_rate: 0.98

resources:
  # 130–160 MB each of long-format CSV: one row per commune × warming level ×
  # ensemble statistic. transform.py streams them and keeps what it needs.
  # The /datasets/r/<id> links are data.gouv's stable resource URLs; the dated
  # static paths behind them rotate on republication.
  vcn10:
    url: "https://www.data.gouv.fr/api/1/datasets/r/2d847dcc-26fb-4dbe-ad6c-5fb9e90b7cec"
    filename: "explore2_commune_vcn10_ete.csv"
    indicator: "VCN10_été"
  duration:
    url: "https://www.data.gouv.fr/api/1/datasets/r/c6a35c98-6d1a-4468-b40d-67fc21de89ea"
    filename: "explore2_commune_dtbe.csv"
    indicator: "dtBE_été"

# Warming levels in the file, as France-wide temperature rise above pre-industrial.
# TRACC uses +2.7 °C as the planning trajectory for 2050 and +4 °C for 2100.
warming:
  reference: "+2.7°C France"
  high: "+4°C France"

# Ensemble statistics across the multi-model projections. q50 is the headline;
# q05 and q95 carry the spread, which on this indicator is wide enough that
# showing the median alone would be misleading.
statistics:
  median: "q50"
  low: "q05"
  high: "q95"

notes: |
  VCN10 estival: the lowest 10-day average daily flow of the summer, the standard
  French low-water indicator. Values are percentage change against the 1976–2005
  reference, so −20 means the summer low point runs a fifth weaker than it did.

  94.7% of communes project a drier summer low flow at +2.7 °C, median −14%.
  That near-unanimity is the finding: this is not a map of which places get
  drier, it is a map of how much drier, and the few positive values are mostly
  snowmelt-fed Alpine catchments where earlier melt raises the summer minimum.

  The aggregation is RARE's, not mine. Explore2 simulates flow at gauged points
  on the river network, not on communes, so RARE attached each commune to the
  simulation points of its catchment. `etiage_origine` carries their quality
  flag: 65% of communes get values from a simulation point in their own
  catchment, 28% from a nearby one and 7% from a distant one. The last group is
  a weak inference and the field is exposed so it can be seen rather than
  assumed away.

  dtBE été, the duration of the summer low-water period, comes from the same
  RARE aggregation and is in days of change against 1976–2005: +20 means the
  low-water stretch lasts twenty days longer. It is the other half of a drier
  summer — a river can bottom out at much the same flow and still be low for
  three weeks longer. Median +12 days at +2.7 °C; the model spread (q05 to q95)
  typically runs from about −11 to +37 days, so it is kept in the popup.

  This is a projection, and it pairs with vigieau_secheresse, which is the
  opposite kind of evidence: restrictions actually imposed last year. Where a
  commune is already under crisis restrictions *and* projects a sharp low-flow
  decline, the two layers agree and that agreement means something.
