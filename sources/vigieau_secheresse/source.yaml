  member: "restrictions_communes_2026.json"

notes: |
  Actual lived constraint rather than a model: one record per commune per day,
  per usage type (AEP drinking water, SOU groundwater, SUP surface water), at one
  of four levels — vigilance, alerte, alerte_renforcee, crise. The headline
  indicator counts days at alerte renforcée or crise, which is where real
  restrictions on households bite.

  The zip is 7 MB but expands to ~540 MB of JSON, so transform.py streams it
  rather than loading it. The raw zip is what stays in data/raw.
