id: rivieres
name: "Rivières, canaux et plans d'eau (BD CARTO® V5)"
attribution: "IGN — BD CARTO® V5, réseau hydrographique (Géoplateforme WFS) — Licence Ouverte 2.0"
url: "https://geoservices.ign.fr/bdcarto"
fetched: 2026-09-12
source_crs: "EPSG:2154"      # requested from the WFS in Lambert-93, reprojected in transform.py
kind: line
also_geometry: [Polygon]     # the lake surfaces, filled beneath the lines
fetch: auto
order: 32

wfs:
  endpoint: "https://data.geopf.fr/wfs/ows"
  typename: "BDCARTO_V5:troncon_hydrographique"
  page_size: 5000
  sort_by: "cleabs"          # paging without a stable sort silently duplicates and drops rows
  # Only the six attributes that are actually rendered or shown on click. The
  # full record is 20 fields and PROPERTYNAME halves both the download and the
  # time it takes — 250k features is 130 MB rather than 270 MB.
  properties:
    - cleabs
    - nature
    - classe_de_largeur
    - navigabilite
    - persistance
    - cpx_toponyme_de_cours_d_eau
    - geometrie

# Lakes, reservoirs and lagoons, drawn as areas under the lines. BD CARTO's
# surface table also holds the wide rivers as polygons; those are left out so a
# river stays a line at every zoom.
surfaces:
  typename: "BDCARTO_V5:surface_hydrographique"
  page_size: 5000
  sort_by: "cleabs"
  properties:
    - cleabs
    - nature
    - persistance
    - cpx_toponyme_de_plan_d_eau
    - geometrie
  # Standing open water. Not taken: flowing water and canals (already lines),
  # estuaries, marshes (wetland, not open water), glaciers, harbour basins (sea
  # water behind a quay) and storm basins (dry most of the time).
  natures:
    lac: ["Lac", "Mare", "Lagune"]
    retenue:
      - "Retenue"
      - "Retenue-barrage"
      - "Retenue-digue"
      - "Plan d'eau de gravière"
      - "Réservoir-bassin"
      - "Réservoir-bassin piscicole"

# Feature-level minzoom per lake area (km²), largest first. A 1 km² lake is
# under a pixel with all of France in view, so the small ones wait for zoom;
# tippecanoe would otherwise smear 80,000 farm ponds into speckle.
surface_tiers:
  - [1.0, 4]
  - [0.1, 7]
  - [0.01, 9]
  - [0, 11]

# BD CARTO holds 1,635,073 hydrographic segments. 1,222,391 of them are under
# 5 m wide — ditches, headwater streams and drains that are invisible at any
# zoom this map reaches and would dominate the tileset. Cutting at 5 m leaves
# 250,653: every river and canal a person would name.
width_classes:
  - "Entre 5 et 15 m"
  - "Entre 15 et 50 m"
  - "Plus de 50 m"

# Feature-level tippecanoe minzoom per width class. Every class is drawn from
# zoom 4 so the whole network is on screen with all of France in view; the zoom-
# interpolated line width in layer.json keeps the 5–15 m class hairline-thin
# there. Raise a tier to thin the national view again.
zoom_tiers:
  "Plus de 50 m": 4
  "Entre 15 et 50 m": 4
  "Entre 5 et 15 m": 4
navigable_tier: 4

tiling:
  tiles: always
  min_zoom: 4
  max_zoom: 12

notes: |
  The hydrographic network at BD CARTO's ~1:50,000 generalisation, which is the
  right scale for a national overlay. BD TOPO is the same network at 1:5,000 and
  is roughly ten times the volume for no visible gain above zoom 12.

  **Width is a class, not a measurement.** BD CARTO records `classe_de_largeur`
  as one of four buckets, so the rendered line weight is ordinal. A segment in
  "Plus de 50 m" is not drawn wider than another in the same class because it is
  wider — only because the class is.

  Canals are kept as a separate colour rather than folded into rivers. In France
  the distinction is the point: a canal is an engineered right of way with a
  towpath and locks, and the navigable network — 13,019 segments — is what
  determines whether a boat, a cycle route or a freight barge can pass.

  `persistance` distinguishes permanent from intermittent flow. South of a line
  roughly from Bordeaux to Lyon a meaningful share of the mapped network is
  intermittent, and a map that draws those the same as the Rhône overstates how
  much water the south actually has. They are drawn dashed.

  **Lakes are areas, rivers stay lines.** Lakes, ponds and coastal lagoons are
  filled blue; reservoirs, gravel pits and fish or water-supply basins are
  filled teal, the canal colour, because they are built and managed — a
  reservoir can be drawn down in a drought in a way a natural lake cannot. The
  violet "through standing water" segments still run across them: that is the
  network's own centreline, and it shows which river a lake belongs to.
