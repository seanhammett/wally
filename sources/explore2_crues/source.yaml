notes: |
  QJXA: the highest daily mean flow of the year, averaged over the years of each
  warming level, as a percentage change against 1976–2005. It is the flood
  indicator Explore2 publishes for every simulation point, and the one the
  "Hausse des crues 2050" indicator of Projet Celsius's habitability map uses.

  Read it for what it is. It is a daily mean, so it sees river floods that build
  over a day or more, not flash floods from a storm cell on a small catchment,
  and it says nothing about where water goes when the river overtops — that is
  the flood-zone mapping in georisques_gaspar. A place can have a sharply rising
  flood peak and no one living in the flood plain, and the reverse.

  The spread across models is wide: the median commune is +13% at +2.7 °C, but
  its q05–q95 range runs from about −13% to +47%. The median is the headline and
  the spread is in the popup. The same RARE quality flag as the low-flow layers
  applies: some communes get their value from simulation points in a
  neighbouring or distant catchment.
