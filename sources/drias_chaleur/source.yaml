id: drias_chaleur
name: "Nuits tropicales et jours >35 °C à l'horizon 2050 (DRIAS)"
attribution: "DRIAS / Météo-France — DRIAS-2020, TRACC"
url: "https://drias-climat.fr/commande"
fetched: null
source_crs: "EPSG:4326"
kind: commune_table
fetch: manual
optional: true          # the build succeeds without it and prints instructions instead
order: 50
min_join_rate: 0.90

expected_files:
  - "drias_communes_2050.csv"

manual_instructions: |
  DRIAS needs a personal account (free) and its site sits behind a bot-defence
  challenge, so this cannot be automated and must not be scraped. Order by hand:

    1. Create an account on drias-climat.fr (Espace Données et Produits).
    2. Order the TRACC-2023 indicators by warming level — the mean at the
       +2.7 °C France level (+2 °C global), not the annual time series, which is
       tens of GB. Ensemble median, SAFRAN 8 km grid, NetCDF or CSV:
         - TR     nuits tropicales (Tn ≥ 20 °C)
         - TX35D  jours avec Tx ≥ 35 °C
    3. On drias-eau.fr, the same TRACC-2023 set: SWI04D (days with soil wetness
       index below 0.4 — dry soil).
    4. Put everything that arrives, unrenamed, in data/raw/drias_chaleur/.

  Each indicator on the ~9,000-point SAFRAN grid should be a few MB. The files
  are grid-keyed, not commune-keyed; transform.py is to be rewritten against the
  delivered format to weight them by where residents live, the way meteo_climat
  handles the same grid.

  Validate the result against Climadiag Commune (climadiag-commune.meteofrance.com),
  which publishes per-commune values as one PDF per commune. It is a spot-check
  tool, not a data source — but if the computed tropical-nights figure for a
  handful of communes does not match Climadiag's, the aggregation is wrong.

notes: |
  By some distance the most work in the catalogue. Left disabled until everything
  else runs, exactly as the plan advises — and kept in the tree as the worked
  example of a `fetch: manual` source.

  `sources/meteo_chaleur/` now covers the automatable part of this: the same two
  families of indicator from the openly published Aladin-Climat files, joined to
  communes by nearest grid point. It does not replace this source. What is still
  only available through the order form below is the days-above-35 °C count, and
  the DRIAS-2020/TRACC model generation, which projects more French summer
  warming than the 2014 runs meteo_chaleur uses. Ordering this data upgrades
  both; until then meteo_chaleur is the conservative stand-in.
