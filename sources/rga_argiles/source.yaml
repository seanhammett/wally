notes: |
  The fastest win in the catalogue: Géorisques already publishes this as a 122 MB
  PMTiles archive on data.gouv.fr, served with CORS and HTTP range requests. There
  is nothing to download, transform or tile — the layer points straight at it.

  It is kept as its own layer rather than folded into a hazard score, because
  clay shrink-swell is a foundation-engineering cost, not a habitability
  constraint: it changes what a renovation costs, not whether a place is livable.

  If the remote file ever disappears, the fallback is the department shapefiles on
  Géorisques: fetch: manual, then a normal Pattern B transform.
