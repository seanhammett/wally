notes: |
  The most recent presidential election; the next is due in 2027.

  Two gotchas, both load-bearing. The file is latin-1, not UTF-8, and decimal
  values use a comma. And "Code de la commune" is only the three-digit slice —
  the INSEE code is the department code concatenated with it, which is why
  Corsica works out as 2A004 and why reading the column on its own gives a key
  that matches nothing.

  The candidate columns repeat in blocks of seven to the end of the row, one
  block per candidate, so a fixed column map does not survive the difference
  between the twelve-candidate first round and the two-candidate second.
