  residents:        # activity status of residents, by age band
    url: "https://api.insee.fr/melodi/file/DS_RP_EMPLOI_LR_PRINC/DS_RP_EMPLOI_LR_PRINC_2023_CSV_FR"
    filename: "DS_RP_EMPLOI_LR_PRINC_2023.zip"
    member: "DS_RP_EMPLOI_LR_PRINC_2023_data.csv"
  formes:           # employed residents: self-employed / employee, contract, working time
    url: "https://api.insee.fr/melodi/file/DS_RP_ACTIVITE_PRINC/DS_RP_ACTIVITE_PRINC_2023_CSV_FR"
    filename: "DS_RP_ACTIVITE_PRINC_2023.zip"
    member: "DS_RP_ACTIVITE_PRINC_2023_data.csv"
  lieu_travail:     # jobs located in the commune, whoever holds them
    url: "https://api.insee.fr/melodi/file/DS_RP_EMPLOI_LT_PRINC/DS_RP_EMPLOI_LT_PRINC_2023_CSV_FR"
    filename: "DS_RP_EMPLOI_LT_PRINC_2023.zip"
    member: "DS_RP_EMPLOI_LT_PRINC_2023_data.csv"

# Below this many people in a rate's denominator the rate is published blank.
# The principal exploitation is a full count, so a village's figure is not a
# sampling estimate — but a rate over 25 people moves 4 points per person, and
# that reads as a signal on a map when it is not one.
min_denominateur: 30

