# Three cubes from INSEE's Melodi file API. Each carries every geographic level
# and the 2012 and 2017 censuses as well as 2023; only COM rows at `millesime`
# are kept. Unzipped they are 1.2 GB, 590 MB and 135 MB, so they are streamed
# out of the zip rather than extracted.
