notes: |
  What the people who live here do for a living, from the 2023 census.

  **Employment rate is the headline, not unemployment.** The employment rate —
  people in work as a share of all 15–64 year-olds — counts everyone, including
  those who have stopped looking. Unemployment only counts people who say they
  are looking, and in the census that is self-declared: it runs several points
  above the ILO rate INSEE publishes quarterly (about 11% nationally in 2023, against 7–8%), and
  should be compared commune to commune, never against the national headline.

  **Self-employed** covers everyone INSEE classes as non-salarié: farmers,
  artisans, shopkeepers, liberal professions, company heads who are not salaried,
  and micro-entrepreneurs whose main job it is. A second job run on the side is
  not counted — the census records one main activity per person.

  **Insecure contracts** is the share of employees on anything but a permanent
  contract or civil-service post: fixed-term, temping, apprenticeship,
  subsidised contract, internship. Apprentices lift it in communes with a
  training centre; seasonal work lifts it in resorts.

  **Jobs per 100 working residents** (INSEE's *indicateur de concentration
  d'emploi*) divides the jobs located in the commune by its residents in work.
  Above 100 the commune imports workers each morning — a town centre, a business
  park, a hospital. Far below it the commune is residential and its people work
  elsewhere. It says nothing about whether the residents hold the local jobs.

  Rates are blank where the denominator is under 30 people.
