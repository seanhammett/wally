notes: |
  2.3 million populated 200 m squares covering 63 million people, in LAEA
  (EPSG:3035). Filosofi 2019 is the latest carroyé edition. It is used purely
  as weights — "how many people live here" — so a few years' drift in where
  people live moves the weights, not the data being weighted.

  Used by `eea_qualite_air` and `meteo_climat`, so a commune's air quality and
  climate describe where its residents are rather than the average over its
  woods, fields and mountain tops.
